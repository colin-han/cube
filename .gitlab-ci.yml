stages:
  - build
  - publish

default:
  image: node:20

variables:
  YARN_CACHE_FOLDER: .yarn-cache
  NPM_REGISTRY: "http://eyeguide-repo.essexlg.com:8081/repository/npm-private/"
  NPM_TOKEN: "YWRtaW46VU1waFVQMF9qMTRTMFJTT0FYNng="

.cache: &cache
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn-cache/
    policy: pull

# ── Build ────────────────────────────────────────────────────────────────────

build:
  stage: build
  tags:
    - repo-builder
  <<: *cache
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn-cache/
    policy: pull-push
  script:
    - echo "registry=https://registry.npmjs.org/" > .npmrc
    - yarn install --frozen-lockfile
    - yarn tsc
    - yarn build
    - cd packages/cubejs-playground && SKIP_PREFLIGHT_CHECK=true yarn build:playground
  artifacts:
    paths:
      - packages/*/dist/
      - packages/*/lib/
      - packages/cubejs-server-core/playground/
      - rust/*/dist/
    expire_in: 1 hour


# ── Publish to npm ───────────────────────────────────────────────────────────
# Only publish packages needed for: @cubejs-backend/server + clickhouse-driver
# Full dependency tree (14 packages):
#   shared → base-driver → clickhouse-driver
#   cubesql (rust) → native → schema-compiler
#   cubestore (rust) → cubestore-driver → query-orchestrator → api-gateway → server-core → server
#   cloud, templates → server-core

publish:
  stage: publish
  tags:
    - repo-builder
  <<: *cache
  dependencies:
    - build
  script:
    - echo "registry=${NPM_REGISTRY}" > .npmrc
    - echo "//${NPM_REGISTRY#http://}:_authToken=${NPM_TOKEN}" >> .npmrc
    - yarn install --frozen-lockfile
    - >
      yarn lerna publish from-package --yes --no-verify-access
      --registry ${NPM_REGISTRY}
      --scope '@cubejs-backend/{shared,base-driver,cubesql,cubestore,native,templates,cloud,schema-compiler,cubestore-driver,query-orchestrator,api-gateway,server-core,server,clickhouse-driver}'
  # rules:
  #   - if: $CI_COMMIT_BRANCH == "master"
