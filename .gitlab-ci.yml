stages:
  - build
  - publish

default:
  image: node:20

variables:
  YARN_CACHE_FOLDER: .yarn-cache
  NPM_REGISTRY: "http://eyeguide-repo.essexlg.com:8081/repository/npm-private/"

.cache: &cache
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn-cache/
    policy: pull

# ── Build ────────────────────────────────────────────────────────────────────

build:
  stage: build
  tags:
    - repo-builder
  <<: *cache
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn-cache/
    policy: pull-push
  script:
    - yarn install --frozen-lockfile
    - yarn tsc
    - yarn lerna run build --stream --ignore 'cubejs-testing*' --ignore 'cubejs-linter' --ignore 'cubejs-docker'
  artifacts:
    paths:
      - packages/*/dist/
      - packages/*/lib/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# ── Publish to npm ───────────────────────────────────────────────────────────

publish:
  stage: publish
  tags:
    - repo-builder
  <<: *cache
  dependencies:
    - build
  script:
    - yarn lerna publish from-package --yes --no-verify-access --registry ${NPM_REGISTRY}
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
